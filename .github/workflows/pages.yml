name: Deploy web to GitHub Pages

# 把 web/ 目录（纯静态：index.html + styles.css + data.js + app.js + PWA 文件）
# 发布到 GitHub Pages。推送到 main 时自动部署，也可在 Actions 页手动触发。
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 注意：不用 enablement: true。该参数会调用 API 自动开启 Pages，
      # 在本仓库会因 token 权限不足而失败；Pages 已在仓库 Settings → Pages
      # 里手动把 Source 设为 "GitHub Actions"，这里只需读取配置。
      - uses: actions/configure-pages@v5

      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
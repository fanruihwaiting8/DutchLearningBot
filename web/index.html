<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + the safe-area padding below: fits iPhone notch / Dynamic Island -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#3b6cf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dutch B1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Dutch B1 Exam Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <button id="btn-back" class="icon-btn" hidden aria-label="Back">&lsaquo;</button>
  <div class="topbar-title">
    <h1 id="page-title">Dutch B1 Exam Dashboard</h1>
    <p id="page-sub">Inburgeringsexamen &middot; reading / listening / writing / speaking + KNM + ONA</p>
  </div>
</header>

<main id="view" class="view"></main>

<!-- bottom main navigation: reachable one-handed on a phone -->
<nav class="tabbar">
  <button class="tab" data-route="daily">
    <span class="tab-ico">&#9728;</span><span>Today</span>
  </button>
  <button class="tab" data-route="dashboard">
    <span class="tab-ico">&#9678;</span><span>Dashboard</span>
  </button>
  <button class="tab" data-route="woorden">
    <span class="tab-ico">&#9670;</span><span>Words</span>
  </button>
  <button class="tab" data-route="stats">
    <span class="tab-ico">&#9636;</span><span>Stats</span>
  </button>
</nav>

<!-- ======== template: vocabulary practice page ======== -->
<template id="tpl-woorden">
  <div class="toolbar">
    <select id="theme-select" class="select" aria-label="Theme"></select>
    <div class="seg" id="mode-seg">
      <button class="seg-btn" data-mode="flash">Flashcards</button>
      <button class="seg-btn" data-mode="choice">Choice</button>
      <button class="seg-btn" data-mode="spell">Spelling</button>
    </div>
  </div>
  <div id="practice"></div>
</template>

<!-- ======== template: flashcard ======== -->
<template id="tpl-flash">
  <div class="card tap-card" id="flash-card">
    <div class="card-head">
      <span class="muted" id="flash-progress"></span>
      <span class="ok-tag" id="flash-mastered"></span>
    </div>
    <div class="card-body">
      <div class="word-nl" id="flash-nl"></div>
      <button class="speak-btn" id="flash-speak">&#128266; Listen</button>
      <div class="flash-back" id="flash-back" hidden>
        <div class="word-en" id="flash-en"></div>
        <div class="ex-nl" id="flash-ex-nl"></div>
        <div class="ex-en" id="flash-ex-en"></div>
        <button class="speak-btn ghost" id="flash-speak-ex" hidden>&#128266; Listen to example</button>
      </div>
      <p class="hint" id="flash-hint">Tap the card to flip</p>
    </div>
  </div>
  <div class="row-btns">
    <button class="btn grey" id="flash-prev">Previous</button>
    <button class="btn green" id="flash-master">Mark as mastered</button>
    <button class="btn" id="flash-next">Next</button>
  </div>
</template>

<!-- data.js is generated by tools/build_web_data.py from data/*.json (words / reading / sentences) -->
<script src="data.js"></script>
<script src="app.js"></script>
<!-- daily.js depends on window.AppBridge exposed by app.js, so it must come after -->
<script src="daily.js"></script>
<script>
  // Register the service worker only over http(s) (file:// throws); used for offline caching
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
